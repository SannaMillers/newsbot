name: Nachrichten sammeln

# Laeuft taeglich um 05:12 UTC - das sind 07:12 deutscher Sommerzeit
# und 06:12 im Winter. Zusaetzlich jederzeit auf Knopfdruck:
# Reiter "Actions" -> "Nachrichten sammeln" -> "Run workflow".
#
# Zwei Sammellaeufe: Technik/Wirtschaft nach news/, Rechtsetzung nach gesetze/.
on:
  schedule:
    - cron: "12 5 * * *"
  workflow_dispatch:
    inputs:
      je_quelle:
        description: "Meldungen je Quelle"
        required: false
        default: "30"
      stunden:
        description: "Zeitraum in Stunden"
        required: false
        default: "36"

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sammellauf Technik und Wirtschaft
        run: |
          python newsbot.py --cli \
            --je-quelle "${{ inputs.je_quelle || '30' }}" \
            --stunden "${{ inputs.stunden || '36' }}"

      - name: Sammellauf Gesetze und Verordnungen
        if: always()
        run: |
          python newsbot.py --cli \
            --quellen gesetze_quellen.txt \
            --ausgabe gesetze \
            --titel "Rechtslage" \
            --alles \
            --je-quelle 25 \
            --stunden 30

      - name: Ergebnis einchecken
        if: always()
        run: |
          git config user.name  "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add news/ gesetze/
          if git diff --staged --quiet; then
            echo "Keine Aenderung - nichts einzuchecken."
          else
            git commit -m "Sammellauf $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
