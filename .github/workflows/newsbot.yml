name: Nachrichten sammeln

# Startet auf Knopfdruck: Reiter "Actions" -> "Nachrichten sammeln" ->
# rechts der Knopf "Run workflow".
# Laeuft ausserdem taeglich automatisch (Zeit unten in UTC).
on:
  workflow_dispatch:
    inputs:
      je_quelle:
        description: "Meldungen je Quelle"
        required: false
        default: "30"
      stunden:
        description: "Zeitraum in Stunden"
        required: false
        default: "36"
  schedule:
    # 05:12 UTC = 07:12 deutscher Sommerzeit
    - cron: "12 5 * * *"

# Der Lauf schreibt das Ergebnis zurueck ins Repository.
permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sammellauf Technik und Wirtschaft
        run: |
          python newsbot.py --cli \
            --je-quelle "${{ inputs.je_quelle || '30' }}" \
            --stunden "${{ inputs.stunden || '36' }}"

      - name: Sammellauf Gesetze und Verordnungen
        if: always()
        run: |
          python newsbot.py --cli \
            --quellen gesetze_quellen.txt --ausgabe gesetze \
            --titel "Rechtslage" --themen recht \
            --je-quelle 30 --stunden 96

      - name: Ergebnis einchecken
        if: always()
        run: |
          git config user.name  "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add news/ gesetze/
          if git diff --staged --quiet; then
            echo "Keine Aenderung - nichts einzuchecken."
          else
            git commit -m "Nachrichtenlage $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
